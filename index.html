<style>
:root{--bg:#0b0d10;--s1:#12151a;--s2:#181c22;--line:#262b33;--tx:#e7e9ee;--mu:#8e96a3;--ember:#ff6b2c;--ember2:#ff3d00;--gold:#ffb547}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;letter-spacing:-.01em;font-weight:650}
h1{font-size:44px;line-height:1.1}h2{font-size:26px}h3{font-size:17px}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:40px 24px 64px}
#embers{position:fixed;inset:0;pointer-events:none;z-index:0}
main,.foot-site{position:relative;z-index:1}
.top{position:sticky;top:0;z-index:10;background:rgba(11,13,16,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--ember),var(--gold),transparent);background-size:200% 100%;animation:heat 6s linear infinite;opacity:.8}
@keyframes heat{to{background-position:200% 0}}
.bar{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.nav a{padding:7px 11px;border-radius:7px;color:var(--mu);font-size:14px}
.nav a:hover{color:var(--tx);background:var(--s2)}
.nav a.on{color:var(--tx);background:var(--s2);box-shadow:inset 0 -2px 0 var(--ember)}
.pill{font-size:12px;color:var(--mu);border:1px solid var(--line);padding:5px 10px;border-radius:99px}
.pill.on{color:#8ff0b0;border-color:#1f4d33}
.kbd{font-size:12px;color:var(--mu);border:1px solid var(--line);border-radius:6px;padding:3px 7px;cursor:pointer;background:none;font-family:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--s2);color:var(--tx);font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;transition:.15s}
.btn:hover{border-color:#3a414d}
.btn.pri{background:linear-gradient(180deg,#ff7d3d,var(--ember2));border-color:transparent;color:#fff;box-shadow:0 6px 20px -8px rgba(255,92,30,.7)}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13px}
.link{background:none;border:0;color:var(--mu);cursor:pointer;font-size:13px;font-family:inherit;padding:0}
.link:hover{color:var(--ember)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);font-weight:600;margin-bottom:10px}
.lead{color:var(--mu);font-size:17px;max-width:620px;margin-top:12px}
.hero{position:relative;padding:72px 0 48px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -10% auto;height:520px;background:radial-gradient(closest-side,rgba(255,107,44,.22),transparent);filter:blur(10px);pointer-events:none;animation:glow 7s ease-in-out infinite alternate}
@keyframes glow{to{transform:translateY(30px) scale(1.06);opacity:.8}}
.hero>*{position:relative}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:18px}
.stat b{display:block;font-size:26px;letter-spacing:-.02em}
.stat span{color:var(--mu);font-size:13px}
.sec{margin-top:52px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:linear-gradient(180deg,var(--s1),#0f1216);border:1px solid var(--line);border-radius:14px;padding:20px;transition:.2s;display:flex;flex-direction:column;gap:10px}
.card:hover{border-color:#3d2a20;box-shadow:0 14px 40px -22px rgba(255,107,44,.45);transform:translateY(-2px)}
.card p.mu{color:var(--mu);font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.2);padding:3px 8px;border-radius:6px;align-self:flex-start}
.meta{color:var(--mu);font-size:13px}
.price{font-size:22px;font-weight:700;letter-spacing:-.01em}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 6px;font-weight:500}
input,select,textarea{width:100%;background:#0c0f13;border:1px solid var(--line);color:var(--tx);padding:10px 12px;border-radius:9px;font:inherit}
input[type=file]{padding:8px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ember);box-shadow:0 0 0 3px rgba(255,107,44,.15)}
textarea{resize:vertical}
.empty{color:var(--mu);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center}
.chat{display:flex;flex-direction:column;height:calc(100vh - 220px);min-height:480px;background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.log{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:11px 15px;border-radius:12px;white-space:pre-wrap;font-size:15px}
.msg.me{align-self:flex-end;background:var(--s2);border:1px solid var(--line)}
.msg.bot{align-self:flex-start;background:linear-gradient(180deg,#1a1d23,#14171c);border:1px solid #2c2620}
.msg.bot::before{content:"Assistant";display:block;font-size:11px;color:var(--ember);font-weight:600;margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase}
.msg.bot{white-space:normal}
.msg.bot p{margin:0 0 8px}.msg.bot p:last-child{margin:0}
.msg.bot ul,.msg.bot ol{margin:4px 0 8px;padding-left:20px}
.msg.bot li{margin:2px 0}
.msg.bot h4{margin:8px 0 4px;font-size:15px}
.msg.bot code{background:#0c0f13;border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.msg.bot pre.code{background:#0c0f13;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;margin:6px 0}
.msg.bot pre.code code{border:0;padding:0;background:none}
.msg.bot a{color:var(--gold)}
.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:var(--s1)}
.composer textarea{min-height:44px;max-height:140px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chips button{background:var(--s2);border:1px solid var(--line);color:var(--mu);padding:7px 12px;border-radius:99px;cursor:pointer;font-size:13px;font-family:inherit}
.chips button:hover{color:var(--tx);border-color:#3a414d}
.cmd{display:grid;grid-template-columns:200px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.cmd code{color:var(--gold);font-family:ui-monospace,Menlo,monospace}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--line);border-top:2px solid var(--ember);color:var(--tx);padding:12px 18px;border-radius:10px;box-shadow:0 20px 40px -20px #000;z-index:20;font-size:14px;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
#pal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:30;display:flex;justify-content:center;padding-top:14vh}
#pal[hidden]{display:none}
.pbox{width:min(560px,92vw);background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px -20px #000;align-self:flex-start}
.pbox input{border:0;border-radius:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 18px}
.pbox a{display:block;padding:11px 18px;color:var(--mu)}
.pbox a:hover,.pbox a.sel{background:var(--s2);color:var(--tx)}
#buyM,#joinM{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
#buyM[hidden],#joinM[hidden]{display:none}
.foot-site{border-top:1px solid var(--line);margin-top:60px;padding:26px 24px;color:var(--mu);font-size:13px;text-align:center;white-space:pre-line}
@media(max-width:860px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.cmd{grid-template-columns:1fr}.nav{order:3;width:100%}h1{font-size:34px}.msg{max-width:92%}}
</style>
</head>

<script>
/* ---------- Data from the Elite Uncopylocked bot ---------- */
const BOT = {
  commands: [
    ["/setup","Setup bot configuration"],["/welcomesetup","Setup welcome message for new members"],["/boostrolesetup","Setup boost role"],
    ["/ticketpanel","Create a ticket creation panel"],["/ticketsetup","Setup ticket system"],["/aichatsetup","Set the channel where AI chats freely (no mention needed)"],

  ],
  features: ["Economy","Leveling and ranks","Ticket system with payment tickets","Moderation and word filter","Giveaways","Backup","Reaction roles","Boost rewards","Welcome messages","AI chat assistant"],
  vip: "VIP members get a unique VIP ID issued by the bot (VIP-1, VIP-2, and so on) and the VIP role in the Discord server.",

    {n:"Legend",h:"@legend_demon_404",r:"Owner"},

  ],

    "Check identities and proof of work before any deal.",
    "Agree on deliverables, milestones, and payment before paying.",
    "Be cautious of pressure to pay immediately.",
    "Never share passwords, session tokens, or recovery codes.",
    "Verify the network and wallet address before sending cryptocurrency.",
    "Staff do not hold funds or guarantee private deals."
  ]
};
const EMBED_FOOTER = "© 2026 Elite Uncopylocked. All Rights Reserved.\nFor any problems, please DM @magmafox63911";
const CATS = ["Decompiled","Uncopylocked","Custom","Scripts","Maps","UI","VFX","Audio","Packs"];
const ROUTES = [["home","Home"],["chat","AI Chat"],["files","Public Files"],["posts","Community"],["market","Marketplace"],["services","Services"],["jobs","Jobs"],["vip","VIP"],["commands","Bot Commands"],["team","Team"],["safety","Safety"],["support","Support"],["requests","File Requests"]];

const RULES = `You are the assistant for Elite Uncopylocked, a Roblox creator community. Answer clearly and concisely. Format answers with Markdown: **bold** for key terms, short bullet or numbered lists for steps, and fenced code blocks for code. You help with Luau and Roblox scripting, game systems, UI, building, and using this community's site and bot.
Facts you may state: Owner is Legend (@legend_demon_404). Chief and Bot Developer is Magma (@magmafox63911). Questions go to @magmafox63911.
Bot slash commands (the only commands that exist): /setup, /welcomesetup, /boostrolesetup, /ticketpanel, /ticketsetup, /aichatsetup, /aichatoff, /balance, /chatstats, /daily, /pay, /payment, /tickets, /closeticket, /rank, /leaderboard, /addword, /removeword, /listwords, /modtoggle, /manexinfo, /dbstatus. Never invent other commands.
Bot features: economy, leveling and ranks, ticket and payment tickets, moderation, giveaways, backup, reaction roles, boost rewards, welcome messages.
VIP: members get a VIP ID such as VIP-1 and the VIP role in Discord. Do not invent prices or VIP perks beyond this.
Payments: for payment problems send users to /payment. Never claim a payment was verified or a role was granted. Staff do not hold funds or guarantee deals. Warn users to verify identities, agree on deliverables first, and never share passwords, tokens, or recovery codes.
Only help with scripts and files the user has the rights to use. Do not help break protections on someone else's paid or private content, and say so briefly when it applies.
If you are not sure about something specific to this community, say so and point to @magmafox63911.`;

/* ---------- Runtime state ---------- */
const C = {acct:null,requests:[],discord:null,db:null,sample:null,assets:null,dl:null,user:null,me:null,posts:[],files:[],listings:[],jobs:[],names:{}};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when = t => t ? new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) : "";
const name = uid => C.names[uid] || "Member";
const mine = x => C.me && x.uid === C.me;
const empty = m => `<div class="empty">${m}</div>`;
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const use = n => (window.claude ? claude.use(n) : Promise.resolve(null)).catch(() => null);

/* ---------- Live data (db) ---------- */
function sub(col, set){
  C.db.collection(col).orderBy("at","desc").limit(200).onSnapshot(
    s => { set(s.docs.map(d => ({id:d.id, ...(d.data() || {})}))); renderLive(); resolveNames(); },
    e => console.warn(col, e.message)
  );
}
async function resolveNames(){
  const all = [...C.posts, ...C.files, ...C.listings, ...C.jobs].map(x => x.uid).filter(Boolean);
  const ids = [...new Set(all)].filter(i => !(i in C.names));
  if (!ids.length || !C.user) return;
  const ps = await C.user.profiles(ids).catch(() => ({}));
  ids.forEach(i => C.names[i] = (ps[i] && ps[i].name) || "Member");
  renderLive();
}
function postCard(p){return `<div class="card"><div class="meta">${esc(p.author)} · ${when(p.created_at)}</div><p>${esc(p.text)}</p></div>`}
function fileCard(f){return `<div class="card"><span class="tag">${esc(f.cat||"File")}</span><h3>${esc(f.title)}</h3><p class="mu">${esc(f.desc)}</p><div class="foot"><span class="meta">${esc(name(f.uid))} · ${when(f.at)}${f.size?` · ${(f.size/1048576).toFixed(1)} MB`:""}</span><button class="btn sm" data-dl="${esc(f.fileId)}|${esc(f.fileName)}">Download</button></div></div>`}
function listCard(l){return `<div class="card"><span class="tag">${esc(l.cat)}</span><h3>${esc(l.title)}</h3><p class="mu">${esc(l.description)}</p><div class="foot"><div><div class="price">$${Number(l.price).toFixed(2)}</div><span class="meta">by ${esc(l.seller)}</span></div><button class="btn pri sm" data-buy="${esc(l.id)}">Buy</button></div></div>`}
function reqCard(r){return `<div class="card"><span class="tag">${esc(r.cat)}</span><h3>${esc(r.title)}</h3><p class="mu">${esc(r.description)}</p><div class="foot"><span class="meta">${r.budget ? "Budget: "+esc(r.budget)+" · " : ""}by ${esc(r.requester)}</span></div></div>`}
function jobCard(j){return `<div class="card"><span class="tag">${esc(j.skill)}</span><h3>${esc(j.title)}</h3><p class="mu">${esc(j.description)}</p><div class="foot"><span class="meta">Budget: ${esc(j.budget || "Negotiated directly")} · by ${esc(j.poster)}</span></div></div>`}
function renderLive(){
  const put = (id, arr, fn, emptyMsg) => { const el = $("#"+id); if (el) el.innerHTML = arr.length ? arr.map(fn).join("") : empty(emptyMsg); };
  put("feed-posts", C.posts, postCard, "No posts yet. Start the conversation.");
  put("feed-files", C.files, fileCard, "No public files yet. Be the first to share one.");
  put("feed-market", C.listings, listCard, "No listings yet. Sell your first file below.");
  put("feed-requests", C.requests, reqCard, "No requests yet. Post the first one.");
  put("feed-jobs", C.jobs, jobCard, "No jobs posted yet.");
  document.querySelectorAll("[data-count]").forEach(el => el.textContent = C[el.dataset.count]?.length ?? 0);
  paintDiscord();
}

/* ---------- Live Discord stats ---------- */
function paintDiscord(){
  const d = C.discord, set = (id, v) => { const el = $("#"+id); if (el) el.textContent = v; };
  set("dc-members", d && d.members != null ? d.members.toLocaleString() : "—");
  set("dc-online", d && d.online != null ? d.online.toLocaleString() : "—");
  set("dc-name", (d && d.name) || "Elite Uncopylocked");
  set("dc-desc", !d ? "Loading live stats…" : d.members != null ? (d.desc || "Official community server") : "Live stats unavailable right now.");
  const hj = $("#hjoin"); if (hj && d && d.members != null) hj.textContent = "Join Discord · " + d.members.toLocaleString() + " members";
  if (d && d.icon) {
    const ic = $("#dc-icon"); if (ic) { ic.src = d.icon; ic.style.display = "block"; }
    const bi = $("#brand-img"); if (bi) { bi.src = d.icon; bi.style.display = "inline-block"; const sv = bi.previousElementSibling; if (sv) sv.style.display = "none"; }
    const f = $("#fav"); if (f) f.href = d.icon;
    const a = $("#apple"); if (a) a.href = d.icon;
  }
}
function discordFrom(j){
  const g = j.guild || {};
  return {name:g.name, desc:g.description || null, icon: g.icon ? `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=128` : null, members:j.approximate_member_count ?? null, online:j.approximate_presence_count ?? null};
}
async function loadDiscord(){
  const sources = [
    async () => { const r = await fetch("/api/discord"); return r.ok ? r.json() : null; },
    async () => { const r = await fetch("https://discord.com/api/v10/invites/2D4KTvA9Sh?with_counts=true"); return r.ok ? discordFrom(await r.json()) : null; }
  ];
  for (const src of sources){
    try { const d = await src(); if (d && d.members != null) { C.discord = d; paintDiscord(); return; } } catch {}
  }
  C.discord = {members:null}; paintDiscord();
}

/* ---------- Pages ---------- */
const P = {
  home: () => `<div class="wrap">
    <section class="hero">
      <div class="eyebrow">Roblox creator community</div>
      <h1>Scripts, maps, and files,<br>forged for creators.</h1>
      <p class="lead">Ask the AI assistant, share public files, sell your work, and find developers for your next build.</p>
      <div class="row" style="margin-top:28px">
        <a class="btn pri" href="#/chat">Open AI assistant</a>
        <a class="btn" href="#/market">Browse marketplace</a>
        <a class="btn" href="#/files">Public files</a>
      </div>

/* ---------- AI chat ---------- */
let turns = [], ctl = null;
function addMsg(role, text){ const log = $("#log"); const d = document.createElement("div"); d.className = "msg " + role; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
document.addEventListener("submit", async e => {
  if (e.target.id !== "chatF") return;
  e.preventDefault();
  const text = $("#ci").value.trim(); if (!text) return;
  $("#ci").value = "";
  addMsg("me", text);
  turns.push({role:"user", content:text});
  const bubble = addMsg("bot", "Thinking…");
  $("#send").hidden = true; $("#stop").hidden = false;
  ctl = new AbortController();
  const sent = turns.slice(-16); while (sent.length && sent[0].role !== "user") sent.shift();
  try {
    const r = await askAI(sent, ctl.signal, ({text})=>{ bubble.innerHTML = md(text); });
    bubble.innerHTML = md(r.text); turns.push({role:"assistant", content:r.text});
  } catch (err) {
    const msg = err.code === "rate_limited" ? "Too many requests right now. Try again in a moment."
      : err.code === "cancelled" ? "Stopped."
      : err.code === "not_granted" ? "The assistant isn't connected yet."
      : "I couldn't finish that reply. Please try again.";
    bubble.innerHTML = md(err.text || msg);
    if (err.text) turns.push({role:"assistant", content:err.text});
  } finally { $("#send").hidden = false; $("#stop").hidden = true; ctl = null; }
});
document.addEventListener("click", e => { if (e.target.id === "stop" && ctl) ctl.abort(); });

/* ---------- AI: OpenRouter via /api/chat, Claude sample as fallback inside Claude ---------- */
async function askAI(sent, signal, onText){
  let res = null;
  try { res = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({messages:sent}), signal}); }
  catch (err) { if (err.name === "AbortError") throw {code:"cancelled", message:"stopped"}; }
  const isApi = res && res.headers.get("content-type") && res.headers.get("content-type").includes("application/json");
  if (res && res.ok && isApi) {
    const j = await res.json().catch(() => ({}));
    if (j.text) { onText({text:j.text, delta:j.text}); return {text:j.text}; }
  }
  if (isApi) throw {code:"upstream_error", message:"Assistant unavailable right now."};
  if (!C.sample) throw {code:"not_granted", message:"assistant not connected"};
  return C.sample([{role:"user", content:RULES}, ...sent], {cache:false, signal, onText});
}

/* ---------- Local storage for community data when no Claude database ---------- */
function localList(col){ try { return JSON.parse(localStorage.getItem("eu_"+col) || "[]"); } catch { return []; } }
function guestId(){ let g = localStorage.getItem("eu_guest"); if (!g) { g = "g_" + Math.random().toString(36).slice(2); localStorage.setItem("eu_guest", g); } return g; }
function addDoc(col, data){
  if (C.db) return C.db.collection(col).add(data);
  const arr = localList(col); arr.unshift({id:Math.random().toString(36).slice(2), ...data});
  localStorage.setItem("eu_"+col, JSON.stringify(arr.slice(0,200))); C[col] = arr.slice(0,200); renderLive();
  return Promise.resolve();
}

/* ---------- Rising forge embers ---------- */
const cv = $("#embers"), cx = cv.getContext("2d");
let W, H, pts = [];
const spark = init => ({x:Math.random()*W, y: init ? Math.random()*H : H+10, r:Math.random()*2+.5, v:Math.random()*.8+.3, s:Math.random()*6.28, c: Math.random()<.5 ? "255,140,40" : "255,210,120"});
function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
size(); addEventListener("resize", size);
for (let i = 0; i < 70; i++) pts.push(spark(true));
(function frame(){
  cx.clearRect(0,0,W,H);
  for (const p of pts){
    p.y -= p.v; p.s += .02; p.x += Math.sin(p.s) * .3;
    if (p.y < -10) Object.assign(p, spark(false));
    cx.beginPath(); cx.fillStyle = `rgba(${p.c},${.4 + Math.random()*.4})`;
    cx.arc(p.x, p.y, p.r, 0, 6.283); cx.fill();
  }
  requestAnimationFrame(frame);
})();

/* ---------- Markdown for chat replies (escapes HTML first) ---------- */
function inline(t){
  return t.replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  return String(src ?? "").split("```").map((part, i) => {
    if (i % 2 === 1) return `<pre class="code"><code>${esc(part.replace(/^[\w+-]*\n/, "").replace(/\n$/, ""))}</code></pre>`;
    let html = "", list = null;
    const close = () => { if (list) { html += `</${list}>`; list = null; } };
    for (const line of esc(part).split("\n")){
      let m;
      if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; continue; }
      if ((m = line.match(/^\s*\d+\.\s+(.*)/))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; continue; }
      close();
      if ((m = line.match(/^#{1,3}\s+(.*)/))) { html += `<h4>${inline(m[1])}</h4>`; continue; }
      if (!line.trim()) continue;
      html += `<p>${inline(line)}</p>`;
    }
    close();
    return html;
  }).join("");
}

/* ---------- Marketplace, requests and orders (Vercel Postgres via /api) ---------- */
async function postJSON(path, obj){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(obj)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong.");
  return j;
}
async function loadMarket(){
  try {
    const [l, q] = await Promise.all([fetch("/api/listings").then(r => r.json()), fetch("/api/requests").then(r => r.json())]);
    C.listings = l.listings || []; C.requests = q.requests || []; renderLive();
  } catch {}
}
function openBuy(id){
  if (!gate("buy files")) return;
  const l = C.listings.find(x => String(x.id) === String(id));
  if (!l) return toast("That listing is no longer available.");
  $("#bm-id").value = l.id;
  $("#bm-info").textContent = `${l.title} · $${Number(l.price).toFixed(2)} · sold by ${l.seller}`;
  $("#bm-result").textContent = "";
  $("#buyM").hidden = false;
  $("#buyF input[name=buyer]").focus();
}
async function placeOrder(v){
  const r = await postJSON("/api/orders", {listingId:v.listing});
  const box = $("#bm-result"); box.textContent = "";
  const p1 = document.createElement("p"); p1.textContent = `Order #${r.id} placed. Your order code is:`;
  const code = document.createElement("div"); code.className = "price"; code.style.letterSpacing = ".15em"; code.textContent = r.code;
  const p2 = document.createElement("p"); p2.className = "mu"; p2.style.marginTop = "10px";
  p2.textContent = "Open a ticket with /payment in Discord and send this code. Once staff confirm payment, check your order under Check an order on the Marketplace page.";
  box.append(p1, code, p2);
  $("#buyF").reset();
}
async function checkOrder(){
  const code = $("#oc").value.trim().toUpperCase(), out = $("#or");
  out.textContent = "Checking…";
  try {
    const r = await fetch("/api/orders?code=" + encodeURIComponent(code));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Order not found.");
    out.textContent = "";
    const t = document.createElement("p"); t.textContent = `${j.listing.title} · status: ${j.status}`; out.append(t);
    if (j.fileUrl) {
      const a = document.createElement("a"); a.className = "btn pri sm"; a.style.display = "inline-flex"; a.style.marginTop = "8px";
      a.href = j.fileUrl; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Open your file"; out.append(a);
    } else {
      const n = document.createElement("p"); n.className = "mu"; n.textContent = "The file link appears here once staff confirm payment.";
      out.append(n);
    }
    if (!j.fileUrl) {
      C.code = code;
      const box = document.createElement("div"); box.style.marginTop = "14px";
      box.innerHTML = `<label>Proof of payment</label><textarea id="pf" rows="2" maxlength="300" placeholder="Link to your payment screenshot, or the transaction ID"></textarea><div class="row" style="margin-top:8px"><button class="btn sm" id="pbtn" type="button">Submit proof</button></div>`;
      out.append(box);
    }
  } catch (err) { out.textContent = err.message || "Order not found."; }
}

/* ---------- Accounts and Discord membership ---------- */
async function loadMe(){
  try { const j = await fetch("/api/me").then(r => r.json()); C.acct = j.user || null; } catch { C.acct = null; }
  paintAuth();
  const flag = new URLSearchParams(location.search).get("auth");
  if (flag === "failed") toast("Sign-in didn't finish. Please try again.");
  if (flag === "ok") toast(C.acct && C.acct.member ? "Welcome! You're verified as a server member." : "Signed in. Join the Discord server to buy, sell and request files.");
  if (flag) history.replaceState(null, "", location.pathname + location.hash);
}
function paintAuth(){
  const el = $("#auth"); if (!el) return;
  const a = C.acct;
  el.innerHTML = a
    ? `<span class="pill ${a.member ? "on" : ""}" style="display:inline-flex;align-items:center;gap:6px"><img src="${esc(a.avatar)}" alt="" width="18" height="18" style="border-radius:50%">${esc(a.name)}${a.member ? " · member" : ""}</span><a class="btn sm" href="/api/auth?route=logout">Sign out</a>`
    : `<a class="btn sm" href="/api/auth?route=discord/login">Sign in with Discord</a><a class="btn sm" href="/api/auth?route=google/login">Google</a>`;
}
function showJoin(text){
  $("#jm-text").textContent = text;
  $("#jm-login").textContent = C.acct ? "Re-check Discord membership" : "Sign in with Discord";
  $("#joinM").hidden = false;
}
function gate(action){
  if (C.acct && C.acct.member) return true;
  showJoin(C.acct
    ? `You're signed in with ${C.acct.provider === "google" ? "Google" : "Discord"}, but to ${action} you need to be a server member. Join the server, then sign in with Discord.`
    : `Sign in with Discord and join the server to ${action}.`);
  return false;
}
function showJoinNudge(){
  const last = Number(localStorage.getItem("eu_join_nudge") || 0);
  if (Date.now() - last < 86400000 || (C.acct && C.acct.member)) return;
  localStorage.setItem("eu_join_nudge", String(Date.now()));
  showJoin("Join the Elite Uncopylocked server to buy, sell and request files, and to get giveaways and updates.");
}

/* ---------- Community posts, jobs and proof ---------- */
async function loadCommunity(){
  try {
    const [p, j] = await Promise.all([fetch("/api/posts").then(r => r.json()), fetch("/api/jobs").then(r => r.json())]);
    C.posts = p.posts || []; C.jobs = j.jobs || []; renderLive();
  } catch {}
}
async function submitProof(){
  const proof = $("#pf").value.trim();
  if (!proof) return toast("Paste a link or transaction ID first.");
  try { await postJSON("/api/proof", {code:C.code, proof}); toast("Proof sent. Staff will review it and deliver your file."); $("#pf").value = ""; }
  catch (err) { toast(err.message); }
}

/* ---------- Boot ---------- */
async function boot(){
  [C.db, C.sample, C.assets, C.dl, C.user] = await Promise.all(["db","sample","assets","downloads","user"].map(use));
  if (C.user) C.me = await C.user.id().catch(() => null);
  const signed = !!C.me; if (!C.me) C.me = guestId();
  paintAuth();
  if (!C.db) { ["posts","files","jobs"].forEach(k => C[k] = localList(k)); }
  renderLive();
  if (C.db) {
    sub("posts", v => C.posts = v);
    sub("files", v => C.files = v);
    sub("jobs", v => C.jobs = v);
  }
  renderLive();
}
route();
boot();
loadDiscord();
loadMarket();
loadCommunity();
loadMe();
setTimeout(showJoinNudge, 9000);
setInterval(loadDiscord, 300000);
</script>
